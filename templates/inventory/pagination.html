{% if rows.paginator.num_pages > 1 %}<nav class="pagination" aria-label="Paginacion"><span>{{ rows.start_index }}-{{ rows.end_index }} de {{ rows.paginator.count }}</span><div>{% if rows.has_previous %}<a class="icon-button" href="?page={{ rows.previous_page_number }}&amp;q={{ q|urlencode }}&amp;state={{ state|urlencode }}{% if request.GET.pending %}&amp;pending=1{% endif %}" title="Pagina anterior" aria-label="Pagina anterior"><i data-lucide="chevron-left"></i></a>{% endif %}<span>{{ rows.number }} / {{ rows.paginator.num_pages }}</span>{% if rows.has_next %}<a class="icon-button" href="?page={{ rows.next_page_number }}&amp;q={{ q|urlencode }}&amp;state={{ state|urlencode }}{% if request.GET.pending %}&amp;pending=1{% endif %}" title="Pagina siguiente" aria-label="Pagina siguiente"><i data-lucide="chevron-right"></i></a>{% endif %}</div></nav>{% endif %}
